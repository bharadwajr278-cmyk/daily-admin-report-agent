name: Daily admin report — 6:00 PM IST

on:
  schedule:
    # GitHub cron is best-effort and can occasionally delay or drop one trigger.
    # Start several automatic backups before 6:00 PM IST. Concurrency below
    # keeps only the newest run alive; that run waits for the final data window.
    - cron: "30,45 10 * * *"
    - cron: "0,15,30,45 11 * * *"
    - cron: "0,15 12 * * *"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: daily-admin-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BROKKET_BASE_URL: ${{ secrets.BROKKET_BASE_URL }}
      BROKKET_LOGIN_PATH: ${{ secrets.BROKKET_LOGIN_PATH }}
      BROKKET_MEMBERS_PATH: ${{ secrets.BROKKET_MEMBERS_PATH }}
      BROKKET_QUERIES_PATH: ${{ secrets.BROKKET_QUERIES_PATH }}
      BROKKET_PHONE: ${{ secrets.BROKKET_PHONE }}
      BROKKET_PASSWORD: ${{ secrets.BROKKET_PASSWORD }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
      REPORT_RUN_MODE: ${{ github.event_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest -v test_main.py

      - name: Generate and email report
        run: python main.py
